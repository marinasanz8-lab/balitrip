<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9F5A"/>
      <stop offset="100%" stop-color="#FF4F9B"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded square -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Balloon, drawn in a small local grid then scaled/centered -->
  <g transform="translate(236 244) scale(23)">

    <!-- Envelope -->
    <path fill="#FFFFFF" d="M12 1.3
      C7.9 1.3 5.3 6.0 5.3 9.9
      C5.3 13.5 7.6 15.9 9.8 17.1
      L9.8 18.1
      L14.2 18.1
      L14.2 17.1
      C16.4 15.9 18.7 13.5 18.7 9.9
      C18.7 6.0 16.1 1.3 12 1.3 Z"/>

    <!-- Panel seams (stroked with the same background gradient so they read as gaps in the white envelope) -->
    <path fill="none" stroke="url(#bg)" stroke-width="0.5" d="M12 1.6
      C10.7 4.3 10.0 7.4 10.0 9.9
      C10.0 13.0 10.8 16.0 12 18.05
      C13.2 16.0 14.0 13.0 14.0 9.9
      C14.0 7.4 13.3 4.3 12 1.6 Z"/>
    <path fill="none" stroke="url(#bg)" stroke-width="0.5" d="M8.3 4.2
      C7.0 6.1 6.4 8.0 6.6 10.2
      C6.8 12.6 8.2 14.7 9.8 15.9"/>
    <path fill="none" stroke="url(#bg)" stroke-width="0.5" d="M15.7 4.2
      C17.0 6.1 17.6 8.0 17.4 10.2
      C17.2 12.6 15.8 14.7 14.2 15.9"/>

    <!-- Ropes -->
    <path fill="none" stroke="#FFFFFF" stroke-width="0.65" stroke-linecap="round"
      d="M9.8 18.1 L9.6 19.7 M14.2 18.1 L14.4 19.7"/>

    <!-- Basket -->
    <rect x="9.4" y="19.7" width="5.2" height="2.3" rx="0.5" fill="#FFFFFF"/>

  </g>
</svg>
